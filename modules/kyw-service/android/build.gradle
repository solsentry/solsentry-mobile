plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.solsentry'
version = '0.1.0'

android {
  namespace "app.solsentry.kywservice"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // HeadlessJsTaskService; the version comes from the React Native Gradle plugin.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
}
